name: Sort IP list

on:
  workflow_dispatch:
  push:
    paths:
      - "blocklist.txt"
      - "scripts/sort_ips.py"

permissions:
  contents: write

jobs:
  sort:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sort, deduplicate, and log IP list
        run: python scripts/sort_ips.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sort IP list and record duplicates"
          file_pattern: |
            blocklist.txt
            duplicates.log
