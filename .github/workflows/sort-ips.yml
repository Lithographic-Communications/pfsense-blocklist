name: Sort IP list

on:
  workflow_dispatch:
  push:
    paths:
      - "blocklist.txt"
      - "scripts/sort_ips.py"

permissions:
  contents: write

jobs:
  sort:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sort, deduplicate, and log IP list
        run: python scripts/sort_ips.py

      - name: Show duplicate report
        run: |
          echo "Duplicate log contents:"
          cat duplicates.log
          echo "Git changes:"
          git status --short
          git diff -- duplicates.log

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blocklist.txt duplicates.log

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sort IP list and record duplicates"
            git push
          fi
